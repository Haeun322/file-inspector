name: Deploy latest image to self-hosted runner

on:
  workflow_run:
    workflows: ["Build and push Docker image"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/file-inspector:latest
      NAME: file-inspector
      PORT: "8000"
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull latest image
        run: docker pull "$IMAGE"
      - name: Replace running container
        shell: bash
        run: |
          docker rm -f "$NAME" 2>/dev/null || true
          docker run -d --name "$NAME" --restart unless-stopped -p "$PORT:8000" "$IMAGE"
      - name: Verify service is healthy
        shell: bash
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:$PORT/api/health"; then echo; echo "OK"; exit 0; fi
            sleep 1
          done
          echo "service did not come up"; docker logs "$NAME"; exit 1
      - name: Prune old images
        run: docker image prune -f
